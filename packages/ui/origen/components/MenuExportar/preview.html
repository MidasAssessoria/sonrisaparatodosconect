<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>MenuExportar — preview</title></head>
<body>
<div id="root"></div>
<script>
var C = window.Conecta, h = React.createElement;
function Demo() {
  var e = React.useState('inactivo');
  return h('div', { className: 'cn-demo', style: { minHeight: 232 } },
    h('div', { className: 'cn-demo-fila', style: { alignItems: 'flex-start' } },
      h(C.MenuExportar, { estado: e[0], onElegir: function () { e[1]('preparando'); setTimeout(function () { e[1]('listo'); }, 1400); } }),
      h(C.MenuExportar, { estado: 'preparando' }),
      h(C.MenuExportar, { estado: 'listo' }),
      h(C.MenuExportar, { soloIcono: true })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
