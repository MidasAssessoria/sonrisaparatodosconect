<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Icono — preview</title></head>
<body>
<div id="root"></div>
<script>
var C = window.Conecta, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'cn-demo' },
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(104px, 1fr))', gap: 8 } },
      C.Icono.nombres.map(function (n) {
        return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: '12px 4px', background: 'var(--blanco)', border: '1px solid var(--borde)', borderRadius: 12, fontSize: 12, color: 'var(--tinta-suave)' } },
          h('span', { style: { color: 'var(--tinta)' } }, h(C.Icono, { nombre: n })), n);
      }))));
</script>
</body>
</html>
