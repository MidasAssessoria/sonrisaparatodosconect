<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Boton — preview</title></head>
<body>
<div id="root"></div>
<script>
var C = window.Conecta, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'cn-demo' },
    h('div', { className: 'cn-demo-fila' },
      h(C.Boton, { variante: 'primario', icono: 'mas' }, 'Nuevo turno'),
      h(C.Boton, { icono: 'imprimir' }, 'Imprimir ficha'),
      h(C.Boton, { variante: 'fantasma' }, 'Ver todo'),
      h(C.Boton, { variante: 'peligro' }, 'Desactivar paciente')),
    h('div', { className: 'cn-demo-fila' },
      h(C.Boton, { variante: 'primario', tamano: 'lg', cargando: true }, 'Ingresar'),
      h(C.Boton, { tamano: 'lg', icono: 'exportar', 'aria-label': 'Exportar' }),
      h(C.Boton, { disabled: true }, 'Sin cambios para guardar'))));
</script>
</body>
</html>
