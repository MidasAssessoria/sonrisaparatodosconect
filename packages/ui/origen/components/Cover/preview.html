<!-- @dsCard height=320 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sonrisa Para Todos Conecta</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--crema); color:var(--tinta); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:320px; overflow:hidden; }
  .band { position:absolute; top:0; left:0; width:960px; height:112px; }
  .band svg { display:block; width:960px; height:112px; }
  .turq { fill:var(--turquesa); }
  .coral { fill:var(--coral); }
  .sol { fill:var(--sol); }
  .tinta { fill:var(--tinta); }
  .crema { fill:var(--crema); }
  .blk { rx:var(--radio-tarjeta); }
  /* pills espacio-3 de alto: rx = la mitad del lado corto */
  .pill { rx:6px; }
  .words { position:absolute; left:var(--espacio-6); bottom:var(--espacio-6); max-width:912px; }
  .name { margin:0; font-family:var(--font-display); font-size:64px; line-height:.95; font-weight:600; letter-spacing:-.01em; color:var(--tinta); }
  .tag { margin:var(--espacio-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--tinta-suave); }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocks      turquesa 392×128 (la marca, el bloque mayor) · sol 152×104 · coral 80×128 · tinta 280×128 hasta el borde derecho — todos sangrando por arriba, ≈ un tercio de 960×320
  arrangement banda superior de bloques desiguales (el nombre es largo: esqueleto de banda), separados por espacio-4, bases escalonadas
  pattern     pills, de «chips totalmente redondos» y radio-pill: píldoras de espacio-3 de alto a paso espacio-6, en turquesa sobre tinta y caladas en crema sobre turquesa
  scales      lados en múltiplos de espacio-2; separación espacio-4; paso espacio-6; esquinas radio-tarjeta; píldoras rx = espacio-3 / 2
-->
<rect class="turq blk" x="24" y="-16" width="392" height="128" rx="16"/>
<rect class="sol blk" x="432" y="-16" width="152" height="104" rx="16"/>
<rect class="coral blk" x="600" y="-16" width="80" height="128" rx="16"/>
<rect class="tinta blk" x="696" y="-16" width="280" height="128" rx="16"/>

<rect class="crema pill" x="248" y="40" width="72" height="12" rx="6"/>
<rect class="crema pill" x="336" y="40" width="48" height="12" rx="6"/>
<rect class="crema pill" x="296" y="64" width="88" height="12" rx="6"/>
<rect class="crema pill" x="344" y="88" width="40" height="12" rx="6"/>

<rect class="turq pill" x="720" y="16" width="96" height="12" rx="6"/>
<rect class="turq pill" x="832" y="16" width="48" height="12" rx="6"/>
<rect class="turq pill" x="720" y="40" width="56" height="12" rx="6"/>
<rect class="turq pill" x="792" y="40" width="120" height="12" rx="6"/>
<rect class="turq pill" x="720" y="64" width="136" height="12" rx="6"/>
<rect class="turq pill" x="872" y="64" width="40" height="12" rx="6"/>
<rect class="turq pill" x="720" y="88" width="72" height="12" rx="6"/>
<rect class="turq pill" x="808" y="88" width="64" height="12" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Sonrisa Para Todos<br>Conecta</h1>
<p class="tag">Software odontológico cercano y de confianza, en español y guaraní.</p>
</div>
</div>
</body>
</html>
